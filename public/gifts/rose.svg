<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#990026" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF1E56" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Stem -->
  <path d="M 50,55 Q 52,75 48,95" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Leaf -->
  <path d="M 50,70 Q 65,65 60,78 Q 52,76 50,70 Z" fill="#22C55E"/>
  <path d="M 50,78 Q 35,74 38,85 Q 46,84 50,78 Z" fill="#16A34A"/>
  <!-- Rose Blossom -->
  <g filter="url(#roseGlow)">
    <circle cx="50" cy="38" r="24" fill="url(#roseGrad)" />
    <path d="M 38,32 C 42,22 58,22 62,32 C 60,45 40,45 38,32 Z" fill="#FF4D79"/>
    <path d="M 44,36 C 47,30 53,30 56,36 C 54,42 46,42 44,36 Z" fill="#FF809F"/>
    <path d="M 32,38 C 30,50 45,55 50,55 C 55,55 70,50 68,38 C 65,48 55,50 50,50 C 45,50 35,48 32,38 Z" fill="#800020"/>
  </g>
</svg>
